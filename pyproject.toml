[project]
name = "kalshi-weather-bot"
version = "0.1.0"
description = "Kalshi weather market trading bot — maker-first, low-variance strategy"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "cryptography>=42.0",
    "click>=8.1",
    "pandas>=2.1",
    "plotly>=5.18",
    "nicegui>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[project.scripts]
kalshi-weather = "src.bot.main:cli"
kalshi-setup = "src.ui.setup_wizard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
